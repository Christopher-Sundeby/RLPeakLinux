[package]
name = "tauri-app"
version = "1.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["mmr-wreq"]
mmr-wreq = ["dep:wreq", "dep:wreq-util"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "rustls-tls"] }
tungstenite = { version = "0.24.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
regex = "1.11.1"
urlencoding = "2.1.3"
wreq = { version = "5.3.0", features = ["json", "cookies"], optional = true }
wreq-util = { version = "2.2.6", optional = true }
